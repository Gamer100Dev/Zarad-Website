<!doctype html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zarad Dash</title>
<style>
:root{--bg:#f2c98a;--ink:#3b1d0e;--card:#fff6e3;--acc:#d9441a;--gold:#f2a900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2a1608;--ink:#ffe9c4;--card:#3b2312;--acc:#e8505a}}
:root[data-theme="dark"]{--bg:#2a1608;--ink:#ffe9c4;--card:#3b2312;--acc:#e8505a}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#shelf{position:absolute;top:calc(env(safe-area-inset-top,0px) + 46px);left:12px;display:flex;gap:5px;pointer-events:none}
#shelf span{width:18px;height:18px;border-radius:50%;border:2px solid #fff;opacity:.35}
#shelf span.on{opacity:1;box-shadow:0 0 8px #fff}
#toast{position:absolute;top:28%;left:0;right:0;text-align:center;font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 0 #0007;opacity:0;transition:opacity .3s;pointer-events:none}
#pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 12px}
.ch{font-size:13px;padding:6px 10px;border-radius:10px;box-shadow:0 3px 0 #0005;background:#8a5a3a}
.ch.on{background:var(--acc);outline:3px solid var(--gold)}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #0006;pointer-events:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0000004d}
.card{background:var(--card);color:var(--ink);border:4px solid var(--acc);border-radius:20px;padding:22px 26px;text-align:center;max-width:320px;box-shadow:0 8px 0 #0004}
h1{margin:0 0 4px;font-size:34px;color:var(--acc);letter-spacing:1px}
p{margin:6px 0 14px;font-size:15px;line-height:1.4}
button{font:inherit;font-weight:800;font-size:20px;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:10px 30px;box-shadow:0 5px 0 #0005;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #0005}

#page-tools{position:absolute;z-index:20;top:calc(env(safe-area-inset-top,0px) + 48px);right:12px;display:flex;gap:7px}
#page-tools button{min-height:38px;min-width:42px;padding:7px 12px;border:1px solid #fff4d2;border-radius:999px;background:#4b281ddd;color:#fff5dc;font-size:13px;box-shadow:0 3px 10px #0004}
#page-tools #exit-game{font-size:20px;padding:5px 12px}
#page-tools button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:600px){#page-tools{top:calc(env(safe-area-inset-top,0px) + 48px);right:8px}#page-tools button{min-height:36px;min-width:38px}}
#sound-tools{position:absolute;z-index:20;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:7px}
#sound-tools button{display:flex;align-items:center;gap:7px;min-height:38px;padding:7px 11px;border:1px solid #fff0c4;border-radius:999px;background:#4b281ddd;color:#fff5dc;font-size:12px;box-shadow:0 3px 10px #0004}
#sound-tools button strong{font-size:10px;letter-spacing:.06em;color:#ffdc86}
#sound-tools button[aria-pressed="false"]{opacity:.62;background:#34251ddd}
#sound-tools button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#sound-tools .sound-icon{font-size:16px;line-height:1}
@media(max-width:600px){
  #sound-tools{left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);gap:5px}
  #sound-tools button{min-height:35px;padding:6px 9px;gap:5px;font-size:11px}
  #sound-tools button strong{font-size:9px}
}
#mobile-controls{
  position:absolute;z-index:19;right:calc(env(safe-area-inset-right,0px) + 12px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:none;grid-template-columns:repeat(2,58px);gap:8px;pointer-events:none;
}
#mobile-controls.active{display:grid}
#mobile-controls button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:58px;height:54px;min-height:54px;padding:4px;border:1px solid #fff4d2;
  border-radius:14px;background:#4b281ddd;color:#fff5dc;box-shadow:0 3px 10px #0005;
  pointer-events:auto;touch-action:manipulation;line-height:1;
}
#mobile-controls button span{font-size:20px;font-weight:900}
#mobile-controls button small{font-size:9px;font-weight:900;letter-spacing:.04em}
#mobile-controls button:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 5px #0005}
#mobile-controls button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button,.ch{-webkit-tap-highlight-color:transparent}
@media(max-width:760px){
  html,body{height:100%;height:100dvh}
  canvas{height:100%;height:100dvh}
  #hud{font-size:clamp(16px,4vw,22px);left:9px;right:9px}
  #ov{box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow-y:auto}
  .card{width:min(100%,420px);max-width:420px;max-height:calc(100dvh - 24px);box-sizing:border-box;overflow-y:auto;padding:clamp(14px,4vw,22px) clamp(14px,5vw,26px)}
  h1{font-size:clamp(27px,8vw,34px)}
  #pick{gap:7px;margin-bottom:10px}
  #pick .ch{min-height:40px;padding:8px 10px}
  .card>button{min-height:48px;padding:11px 30px}
  #page-tools{right:8px;gap:6px}
  #page-tools button{min-height:42px;padding:7px 11px}
  #sound-tools{left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
}
@media(max-width:760px) and (max-height:520px){
  #mobile-controls{bottom:calc(env(safe-area-inset-bottom,0px) + 7px);grid-template-columns:repeat(2,50px);gap:6px}
  #mobile-controls button{width:50px;height:46px;min-height:46px}
  #mobile-controls button span{font-size:17px}
  #mobile-controls button small{font-size:8px}
  #sound-tools{bottom:calc(env(safe-area-inset-bottom,0px) + 7px)}
  .card{padding:10px 16px}
  .card p{margin:4px 0 8px;font-size:14px}
  #pick{margin-bottom:6px}
}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="sc">0 m</div><div id="co">🌶️ 0</div></div><div id="shelf"></div><div id="toast"></div>
<div id="page-tools" role="group" aria-label="Game controls">
  <button id="language-toggle" type="button" aria-label="Switch to English" title="English">EN</button>
  <button id="exit-game" type="button" aria-label="Back to website" title="Back to website">×</button>

<div id="sound-tools" role="group" aria-label="Setări audio">
  <button id="music-toggle" type="button" aria-pressed="true" title="Oprește muzica">
    <span class="sound-icon" aria-hidden="true">♫</span><span id="music-label">Muzică</span><strong id="music-state">ON</strong>
  </button>
  <button id="effects-toggle" type="button" aria-pressed="true" title="Oprește efectele sonore">
    <span class="sound-icon" aria-hidden="true">✧</span><span id="effects-label">Efecte</span><strong id="effects-state">ON</strong>
  </button>
</div>
<div id="mobile-controls" role="group" aria-label="Comenzi tactile">
  <button type="button" data-action="l" aria-label="Stânga" title="Stânga"><span aria-hidden="true">◀</span><small id="mobile-left-label">STÂNGA</small></button>
  <button type="button" data-action="r" aria-label="Dreapta" title="Dreapta"><span aria-hidden="true">▶</span><small id="mobile-right-label">DREAPTA</small></button>
  <button type="button" data-action="u" aria-label="Sari" title="Sari"><span aria-hidden="true">▲</span><small id="mobile-jump-label">SARI</small></button>
  <button type="button" data-action="d" aria-label="Alunecă" title="Alunecă"><span aria-hidden="true">▼</span><small id="mobile-roll-label">ALUNECĂ</small></button>
</div>
<div id="ov"><div class="card"><h1 id="t">ZARAD DASH</h1><p id="m"></p><div id="pick"></div><p><span id="spice-total-label">Condimente colectate:</span> <b id="tot">0</b> · <span id="catalog-label">colecție</span> <b id="cat">0</b>/8</p><button id="go">Hai!</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,cv=document.getElementById('c');
let gameLanguage=(()=>{
  const requested=new URLSearchParams(location.search).get('lang');
  if(requested==='ro'||requested==='en')return requested;
  try {
    const saved=localStorage.getItem('zarad-game-language');
    return saved==='en'||saved==='ro'?saved:'ro';
  } catch(e) {
    return 'ro';
  }
})();
const GAME_COPY={
  en:{
    intro:'Race through the spice market and collect every spice in the collection. The more you collect, the more characters you unlock!<br><b>← →</b> change lane · <b>↑</b> jump · <b>↓</b> roll<br>(or swipe)',
    total:'Spices collected:',collection:'collection',start:'Start!',tryAgain:'Try again',
    need:'{name} · {count} spices',newCharacter:'New character: {name}!',
    full:'Full collection!',collected:'{name} +1',over:'Ouch!',
    result:'You ran <b>{distance} m</b> and collected <b>{coins}</b> spices.',
    left:'Left',right:'Right',jump:'Jump',roll:'Slide'
  },
  ro:{
    intro:'Aleargă prin piața de mirodenii și adună condimentele din colecție. Cu cât aduni mai multe, cu atât deblochezi mai multe personaje!<br><b>← →</b> schimbă banda · <b>↑</b> sari · <b>↓</b> rostogolește-te<br>(sau glisează pe ecran)',
    total:'Condimente colectate:',collection:'colecție',start:'Hai!',tryAgain:'Încearcă din nou',
    need:'{name} · {count} condimente',newCharacter:'Personaj nou: {name}!',
    full:'Colecție completă!',collected:'{name} +1',over:'Ups!',
    result:'Ai alergat <b>{distance} m</b> și ai colectat <b>{coins}</b> condimente.',
    left:'Stânga',right:'Dreapta',jump:'Sari',roll:'Alunecă'
  }
};
const CAT_RO=['Turmeric','Ardei iute','Ghimbir','Piper negru','Scorțișoară','Șofran','Cardamom','Boia'];
const CHARACTER_RO=['Bucătar','Cercetaș','Șeful ardeiului iute','Sultan','Maestrul condimentelor'];
function gameText(key,vars={}) {
  const copy=GAME_COPY[gameLanguage]||GAME_COPY.ro;
  const value=copy[key]||GAME_COPY.en[key]||key;
  return value.replace(/\{(\w+)\}/g,(_,name)=>String(vars[name]??''));
}
function spiceName(i){return gameLanguage==='ro'?CAT_RO[i]:CAT[i][0]}
function characterName(c,i){return gameLanguage==='ro'?CHARACTER_RO[i]:c.n}


// Original Moroccan-inspired game audio generated with Web Audio (no external audio files).
const AUDIO_STORAGE_KEY='zarad-dash-audio';
let audioSettings={music:true,effects:true};
try {
  const savedAudio=JSON.parse(localStorage.getItem(AUDIO_STORAGE_KEY)||'{}');
  if(typeof savedAudio.music==='boolean')audioSettings.music=savedAudio.music;
  if(typeof savedAudio.effects==='boolean')audioSettings.effects=savedAudio.effects;
} catch(e) {}
let audioContext=null,musicBus=null,effectsBus=null,musicDelay=null;
let musicTimer=null,nextMusicTime=0,musicStep=0,noiseBuffer=null;

function saveAudioSettings(){
  try{localStorage.setItem(AUDIO_STORAGE_KEY,JSON.stringify(audioSettings))}catch(e){}
}
function updateAudioControls(){
  const musicButton=document.getElementById('music-toggle');
  const effectsButton=document.getElementById('effects-toggle');
  const musicState=document.getElementById('music-state');
  const effectsState=document.getElementById('effects-state');
  const musicLabel=document.getElementById('music-label');
  const effectsLabel=document.getElementById('effects-label');
  const soundTools=document.getElementById('sound-tools');
  const ro=gameLanguage==='ro';
  if(soundTools)soundTools.setAttribute('aria-label',ro?'Setări audio':'Audio settings');
  if(musicState)musicState.textContent=audioSettings.music?'ON':'OFF';
  if(effectsState)effectsState.textContent=audioSettings.effects?'ON':'OFF';
  if(musicLabel)musicLabel.textContent=ro?'Muzică':'Music';
  if(effectsLabel)effectsLabel.textContent=ro?'Efecte':'SFX';
  if(musicButton){
    musicButton.setAttribute('aria-pressed',String(audioSettings.music));
    musicButton.setAttribute('aria-label',ro
      ?(audioSettings.music?'Oprește muzica':'Pornește muzica')
      :(audioSettings.music?'Turn music off':'Turn music on'));
    musicButton.title=musicButton.getAttribute('aria-label');
  }
  if(effectsButton){
    effectsButton.setAttribute('aria-pressed',String(audioSettings.effects));
    effectsButton.setAttribute('aria-label',ro
      ?(audioSettings.effects?'Oprește efectele sonore':'Pornește efectele sonore')
      :(audioSettings.effects?'Turn sound effects off':'Turn sound effects on'));
    effectsButton.title=effectsButton.getAttribute('aria-label');
  }
}
function ensureAudioContext(){
  if(audioContext)return true;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return false;
  try{
    audioContext=new AudioContextClass();
    const compressor=audioContext.createDynamicsCompressor();
    compressor.threshold.value=-22;
    compressor.knee.value=18;
    compressor.ratio.value=3;
    compressor.attack.value=.004;
    compressor.release.value=.24;
    compressor.connect(audioContext.destination);

    musicBus=audioContext.createGain();
    musicBus.gain.value=audioSettings.music?.22:.0001;
    musicBus.connect(compressor);

    effectsBus=audioContext.createGain();
    effectsBus.gain.value=.62;
    effectsBus.connect(compressor);

    musicDelay=audioContext.createDelay(.5);
    musicDelay.delayTime.value=.19;
    const feedback=audioContext.createGain();
    feedback.gain.value=.13;
    const delayReturn=audioContext.createGain();
    delayReturn.gain.value=.1;
    musicBus.connect(musicDelay);
    musicDelay.connect(feedback);
    feedback.connect(musicDelay);
    musicDelay.connect(delayReturn);
    delayReturn.connect(compressor);
    return true;
  }catch(error){
    audioContext=null;
    return false;
  }
}
function midiFrequency(note){return 440*Math.pow(2,(note-69)/12)}
function makeEnvelope(bus,when,peak,attack,release){
  const gain=audioContext.createGain();
  gain.gain.setValueAtTime(.0001,when);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),when+attack);
  gain.gain.exponentialRampToValueAtTime(.0001,when+release);
  gain.connect(bus);
  return gain;
}
function playOudNote(frequency,when,volume){
  const duration=.34;
  const filter=audioContext.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.setValueAtTime(Math.min(5200,frequency*8),when);
  filter.frequency.exponentialRampToValueAtTime(Math.max(520,frequency*2.1),when+duration);
  filter.Q.value=1.25;
  const envelope=makeEnvelope(musicBus,when,volume,.009,duration);
  filter.connect(envelope);

  const fundamental=audioContext.createOscillator();
  fundamental.type='triangle';
  fundamental.frequency.setValueAtTime(frequency,when);
  fundamental.frequency.exponentialRampToValueAtTime(frequency*.992,when+duration);
  fundamental.connect(filter);

  const upper=audioContext.createOscillator();
  const upperGain=audioContext.createGain();
  upper.type='sine';
  upper.frequency.setValueAtTime(frequency*2.01,when);
  upperGain.gain.value=.2;
  upper.connect(upperGain);
  upperGain.connect(filter);

  fundamental.start(when);upper.start(when);
  fundamental.stop(when+duration+.025);upper.stop(when+duration+.025);
}
function playBassNote(frequency,when){
  const oscillator=audioContext.createOscillator();
  const filter=audioContext.createBiquadFilter();
  filter.type='lowpass';filter.frequency.value=360;
  const envelope=makeEnvelope(musicBus,when,.095,.035,.42);
  oscillator.type='triangle';
  oscillator.frequency.setValueAtTime(frequency,when);
  oscillator.frequency.exponentialRampToValueAtTime(frequency*.96,when+.34);
  oscillator.connect(filter);filter.connect(envelope);
  oscillator.start(when);oscillator.stop(when+.46);
}
function getNoiseBuffer(){
  if(noiseBuffer)return noiseBuffer;
  const length=Math.floor(audioContext.sampleRate*.2);
  noiseBuffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
  const data=noiseBuffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
  return noiseBuffer;
}
function playPercussionNoise(kind,when){
  const duration=kind==='shaker'?.035:.075;
  const source=audioContext.createBufferSource();
  source.buffer=getNoiseBuffer();
  const filter=audioContext.createBiquadFilter();
  filter.type=kind==='shaker'?'highpass':'bandpass';
  filter.frequency.value=kind==='shaker'?6800:kind==='tek'?2600:1350;
  filter.Q.value=kind==='tek'?1.1:.7;
  const envelope=makeEnvelope(musicBus,when,kind==='shaker'?.018:.052,.003,duration);
  source.connect(filter);filter.connect(envelope);
  source.start(when);source.stop(when+duration+.01);
}
function playDarbuka(kind,when){
  if(kind==='dum'){
    const drum=audioContext.createOscillator();
    const envelope=makeEnvelope(musicBus,when,.19,.004,.17);
    drum.type='sine';
    drum.frequency.setValueAtTime(142,when);
    drum.frequency.exponentialRampToValueAtTime(57,when+.14);
    drum.connect(envelope);
    drum.start(when);drum.stop(when+.19);
  }else{
    playPercussionNoise(kind,when);
  }
}
const HIJAZ_MELODY=[12,null,7,null,8,null,10,null,8,null,7,null,5,null,4,null,1,null,4,null,5,null,7,null,8,null,10,null,8,null,7,null];
const HIJAZ_BASS=[45,45,52,45];
function scheduleMusicStep(when,step){
  const semitone=HIJAZ_MELODY[step%HIJAZ_MELODY.length];
  if(semitone!==null)playOudNote(midiFrequency(57+semitone),when,step%8===0?.13:.105);
  if(step%8===0)playBassNote(midiFrequency(HIJAZ_BASS[Math.floor(step/8)%HIJAZ_BASS.length]),when);
  const barStep=step%16;
  if([0,6,8,14].includes(barStep))playDarbuka('dum',when);
  else if([3,7,11,15].includes(barStep))playDarbuka('tek',when);
  if(barStep%2===1)playDarbuka('shaker',when);
}
function startMoroccanMusic(){
  if(!audioContext||audioContext.state!=='running'||!audioSettings.music||musicTimer!==null)return;
  musicBus.gain.setTargetAtTime(.22,audioContext.currentTime,.08);
  const stepDuration=60/106/4;
  nextMusicTime=audioContext.currentTime+.06;
  musicStep=0;
  musicTimer=window.setInterval(()=>{
    if(!audioContext||audioContext.state!=='running')return;
    const horizon=audioContext.currentTime+.22;
    while(nextMusicTime<horizon){
      scheduleMusicStep(nextMusicTime,musicStep);
      nextMusicTime+=stepDuration;
      musicStep++;
    }
  },40);
}
function stopMoroccanMusic(){
  if(musicTimer!==null){window.clearInterval(musicTimer);musicTimer=null}
  if(audioContext&&musicBus&&audioContext.state==='running'){
    musicBus.gain.setTargetAtTime(.0001,audioContext.currentTime,.035);
  }
}
function unlockGameAudio(){
  if(!ensureAudioContext())return;
  if(audioContext.state==='suspended'){
    audioContext.resume().then(()=>{
      if(audioSettings.music)startMoroccanMusic();
    }).catch(()=>{});
  }else if(audioSettings.music){
    startMoroccanMusic();
  }
}
function playCollectionSound(){
  if(!audioSettings.effects||!audioContext||audioContext.state!=='running'||!effectsBus)return;
  const notes=[81,88,93];
  const now=audioContext.currentTime;
  notes.forEach((note,index)=>{
    const when=now+index*.043;
    const oscillator=audioContext.createOscillator();
    const overtone=audioContext.createOscillator();
    const overtoneGain=audioContext.createGain();
    const envelope=makeEnvelope(effectsBus,when,.19,.004,.19);
    oscillator.type='sine';
    oscillator.frequency.setValueAtTime(midiFrequency(note),when);
    overtone.type='triangle';
    overtone.frequency.setValueAtTime(midiFrequency(note)*2.01,when);
    overtoneGain.gain.value=.12;
    oscillator.connect(envelope);
    overtone.connect(overtoneGain);overtoneGain.connect(envelope);
    oscillator.start(when);overtone.start(when);
    oscillator.stop(when+.22);overtone.stop(when+.22);
  });
}
function toggleMusic(){
  audioSettings.music=!audioSettings.music;
  saveAudioSettings();
  updateAudioControls();
  if(audioSettings.music)unlockGameAudio();else stopMoroccanMusic();
}
function toggleEffects(){
  audioSettings.effects=!audioSettings.effects;
  saveAudioSettings();
  updateAudioControls();
  if(audioSettings.effects)unlockGameAudio();
}

const R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene();S.background=new T.Color(0xf7c98b);S.fog=new T.Fog(0xf2c98a,35,105);
const cam=new T.PerspectiveCamera(60,1,0.1,200);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<0.8?75:60;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
S.add(new T.HemisphereLight(0xfff0d0,0xb06a3a,0.9));
const sun=new T.DirectionalLight(0xffe2a8,0.8);sun.position.set(-8,14,6);S.add(sun);
const sunB=new T.Mesh(new T.SphereGeometry(14,20,16),new T.MeshBasicMaterial({color:0xffe08a,fog:false}));sunB.position.set(-20,28,-170);S.add(sunB);
const M=c=>new T.MeshLambertMaterial({color:c}),B=(w,h,d)=>new T.BoxGeometry(w,h,d);
function mesh(g,c,x=0,y=0,z=0,p){const m=new T.Mesh(g,typeof c==='number'?M(c):c);m.position.set(x,y,z);(p||S).add(m);return m}
function tex(sz,fn,rx,ry){const c=document.createElement('canvas');c.width=c.height=sz;fn(c.getContext('2d'),sz);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t}

let activeSwipe=null;
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||e.isPrimary===false||st!=='play')return;
  activeSwipe={id:e.pointerId,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointerup',e=>{
  if(!activeSwipe||activeSwipe.id!==e.pointerId)return;
  const gesture=activeSwipe;activeSwipe=null;
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
  if(Math.hypot(dx,dy)<30)return;
  if(Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');
  else act(dy>0?'d':'u');
});

if(py>0||vy>0){vy-=32*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
if(roll>0)roll-=dt;
const rolling=roll>0;
for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.position.z+=dz;const k=o.userData.k;
if(k==='o'){o.rotation.y+=dt*3;if(Math.abs(o.position.z)<.8&&Math.abs(o.position.x-px)<.9&&Math.abs(o.position.y-(py+.9))<1.3){got(o.userData.sp);S.remove(o);objs.splice(i,1);continue}}
else if(Math.abs(o.position.x-px)<1.05&&Math.abs(o.position.z)<(k==='t'?4:.65)+.35){
const hit=k==='t'?py<3.2:k==='c'?py<.9:(py<1.9&&!(rolling&&py<.3));if(hit)die()}
if(o.position.z>14){S.remove(o);objs.splice(i,1)}}
trT.offset.y+=dz/4;zlT.offset.y+=dz/2;
blds.forEach(b=>{b.position.z+=dz;if(b.position.z>25)b.position.z-=140});
sc.textContent=(dist|0)+' m';co.textContent='🌶️ '+coinsN;
const ph=time*sp*.55;lL.rotation.x=Math.sin(ph)*(py>0?.3:.9);lR.rotation.x=-lL.rotation.x;aL.rotation.x=lR.rotation.x;aR.rotation.x=lL.rotation.x;
if(rolling){piv.rotation.x=(1-roll/.6)*Math.PI*2;piv.scale.setScalar(.6);piv.position.y=.55}else{piv.rotation.x=0;piv.scale.setScalar(1);piv.position.y=.9}
P.rotation.z=-(px-LX[lane])*.15}
else if(st==='menu'){lL.rotation.x=lR.rotation.x=aL.rotation.x=aR.rotation.x=0;P.rotation.z=0;piv.rotation.x=0;piv.scale.setScalar(1);piv.position.y=.9}
else if(st==='over'){crashT+=dt;const k=1-Math.pow(1-Math.min(1,crashT/.45),3);if(py>0||vy>0){vy-=32*dt;py=Math.max(0,py+vy*dt)}
piv.scale.setScalar(1);piv.rotation.x=-(Math.PI/2)*k;piv.position.y=.9-.65*k;aL.rotation.x=-2.6*k;aR.rotation.x=-2.2*k;lL.rotation.x=.7*k;lR.rotation.x=-.4*k;P.rotation.z=0;stars.visible=crashT>.35;stars.rotation.y+=dt*6}
if(st==='over')shake=Math.max(0,shake-dt);
P.rotation.y+=((st==='menu'?0:Math.PI)-P.rotation.y)*Math.min(1,dt*10);P.position.set(px,py,st==='over'?Math.min(1,crashT/.45)*1.2:0);
cam.position.set(px*.6+(shake?(Math.random()-.5)*shake:0),5+py*.3,8.5);cam.lookAt(px*.4,1.6,-9);
R.render(S,cam)}
loop();
