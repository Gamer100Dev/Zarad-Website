p{margin:6px 0 14px;font-size:15px;line-height:1.4}
button{font:inherit;font-weight:800;font-size:20px;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:10px 30px;box-shadow:0 5px 0 #0005;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #0005}

for(let r=0;r<2;r++)for(let i=0;i<6;i++)mesh(B(.3,.3,.08),(i+r)%2?0xf4f4f0:0xd7261e,-.75+i*.3,.35+r*.4,0,g);
mesh(B(1.8,.06,.12),0x2a2a30,0,.93,0,g);return fin(g,'c',x,z,.6)}
function beam(x,z){const g=new T.Group();[-.95,.95].forEach(s=>{mesh(B(.14,2.6,.14),0x555a62,s,1.3,0,g);mesh(B(.4,.1,.5),0x333333,s,.05,0,g);mesh(B(.04,.75,.04),0x333333,s*.74,2.22,0,g)});
mesh(B(2.1,.16,.2),0x555a62,0,2.6,0,g);
for(let i=0;i<5;i++)mesh(B(.38,.7,.1),i%2?0x2a2a30:0xf2a900,-.76+i*.38,1.5,0,g);return fin(g,'b',x,z,.4)}
function fin(g,k,x,z,h){g.position.set(x,0,z);g.userData={k,h};S.add(g);objs.push(g);return g}
const sackG=new T.CylinderGeometry(.28,.36,.45,10),ringG=new T.TorusGeometry(.3,.04,6,12),mndG=new T.ConeGeometry(.28,.3,10);
function coins(x,z,n){const s=Math.random()*8|0;for(let i=0;i<n;i++){const g=new T.Group();mesh(sackG,0xb08a5a,0,-.12,0,g);mesh(ringG,0x8a6a40,0,.1,0,g).rotation.x=Math.PI/2;mesh(mndG,CAT[s][1],0,.25,0,g);g.position.set(x,.38,z-i*1.7);g.userData={k:'o',h:.5,sp:s};S.add(g);objs.push(g)}}
function spawn(z){const nb=Math.random()<.45?2:1,free=[0,1,2].sort(()=>Math.random()-.5),bl=free.slice(0,nb),fr=free.slice(nb);
bl.forEach(l=>{const r=Math.random();(r<.4?train:r<.7?cart:beam)(LX[l],z)});
fr.forEach(l=>{if(Math.random()<.75)coins(LX[l],z+3,5,Math.random()<.3)})}
// state
let crashT=0,st='menu',sp=0,dist=0,coinsN=0,nextS=0,lane=1,px=0,py=0,vy=0,roll=0,time=0,shake=0;
const sc=document.getElementById('sc'),co=document.getElementById('co'),ov=document.getElementById('ov'),tt=document.getElementById('t'),mm=document.getElementById('m');
function start(){objs.forEach(o=>S.remove(o));objs.length=0;runF.clear();got.full=0;crashT=0;stars.visible=false;piv.rotation.x=0;piv.scale.setScalar(1);piv.position.y=.9;aL.rotation.x=aR.rotation.x=lL.rotation.x=lR.rotation.x=0;[...sh.children].forEach(s=>s.className='');st='play';sp=14;dist=0;coinsN=0;nextS=0;lane=1;px=0;py=0;vy=0;roll=0;shake=0;ov.style.display='none';spawn(-60)}
function die(){st='over';crashT=.001;sv();pick();shake=.6;tt.textContent=gameText('over');mm.innerHTML=gameText('result',{distance:dist|0,coins:coinsN});document.getElementById('go').textContent=gameText('tryAgain');setTimeout(()=>ov.style.display='flex',700)}
function act(a){if(st!=='play')return;if(a==='l')lane=Math.max(0,lane-1);if(a==='r')lane=Math.min(2,lane+1);
if(a==='u'&&py<.05){vy=11.5;roll=0}if(a==='d'){if(py>.05)vy=-22;roll=.6}}
addEventListener('keydown',e=>{const k={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',' ':'u',ArrowDown:'d',s:'d'}[e.key];if(k){e.preventDefault();act(k)}if(st!=='play'&&(e.key==='Enter')&&ov.style.display!=='none')start()});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.hypot(dx,dy)<25)return;Math.abs(dx)>Math.abs(dy)?act(dx>0?'r':'l'):act(dy>0?'d':'u')});
document.getElementById('go').onclick=start;
window.addEventListener('message',event=>{
  if(event.origin!==location.origin)return;
  if(event.data&&event.data.type==='zarad-language'&&(event.data.language==='ro'||event.data.language==='en'))applyGameLanguage(event.data.language);
});
window.addEventListener('storage',event=>{
  if(event.key==='zarad-language'&&(event.newValue==='ro'||event.newValue==='en'))applyGameLanguage(event.newValue);
});
applyGameLanguage(gameLanguage);
const clk=new T.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);time+=dt;
if(st==='play'){sp=Math.min(32,sp+dt*.35);const dz=sp*dt;dist+=dz*.5;nextS+=dz;
if(nextS>=22+sp*.3){nextS=0;spawn(-110)}
px+=(LX[lane]-px)*Math.min(1,dt*14);
if(py>0||vy>0){vy-=32*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
if(roll>0)roll-=dt;
const rolling=roll>0;
for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.position.z+=dz;const k=o.userData.k;
if(k==='o'){o.rotation.y+=dt*3;if(Math.abs(o.position.z)<.8&&Math.abs(o.position.x-px)<.9&&Math.abs(o.position.y-(py+.9))<1.3){got(o.userData.sp);S.remove(o);objs.splice(i,1);continue}}
else if(Math.abs(o.position.x-px)<1.05&&Math.abs(o.position.z)<(k==='t'?4:.65)+.35){
const hit=k==='t'?py<3.2:k==='c'?py<.9:(py<1.9&&!(rolling&&py<.3));if(hit)die()}
if(o.position.z>14){S.remove(o);objs.splice(i,1)}}
trT.offset.y+=dz/4;zlT.offset.y+=dz/2;
blds.forEach(b=>{b.position.z+=dz;if(b.position.z>25)b.position.z-=140});
sc.textContent=(dist|0)+' m';co.textContent='🌶️ '+coinsN;
const ph=time*sp*.55;lL.rotation.x=Math.sin(ph)*(py>0?.3:.9);lR.rotation.x=-lL.rotation.x;aL.rotation.x=lR.rotation.x;aR.rotation.x=lL.rotation.x;
if(rolling){piv.rotation.x=(1-roll/.6)*Math.PI*2;piv.scale.setScalar(.6);piv.position.y=.55}else{piv.rotation.x=0;piv.scale.setScalar(1);piv.position.y=.9}
P.rotation.z=-(px-LX[lane])*.15}
else if(st==='menu'){lL.rotation.x=lR.rotation.x=aL.rotation.x=aR.rotation.x=0;P.rotation.z=0;piv.rotation.x=0;piv.scale.setScalar(1);piv.position.y=.9}
else if(st==='over'){crashT+=dt;const k=1-Math.pow(1-Math.min(1,crashT/.45),3);if(py>0||vy>0){vy-=32*dt;py=Math.max(0,py+vy*dt)}
piv.scale.setScalar(1);piv.rotation.x=-(Math.PI/2)*k;piv.position.y=.9-.65*k;aL.rotation.x=-2.6*k;aR.rotation.x=-2.2*k;lL.rotation.x=.7*k;lR.rotation.x=-.4*k;P.rotation.z=0;stars.visible=crashT>.35;stars.rotation.y+=dt*6}
if(st==='over')shake=Math.max(0,shake-dt);
P.rotation.y+=((st==='menu'?0:Math.PI)-P.rotation.y)*Math.min(1,dt*10);P.position.set(px,py,st==='over'?Math.min(1,crashT/.45)*1.2:0);
cam.position.set(px*.6+(shake?(Math.random()-.5)*shake:0),5+py*.3,8.5);cam.lookAt(px*.4,1.6,-9);
R.render(S,cam)}
loop();
</script></body></html>
