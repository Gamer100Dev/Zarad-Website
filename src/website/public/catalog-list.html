
<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ead9">
  <meta name="description" content="Descoperă produsele și condimentele Zarad.">
  <title>Produs — Zarad</title>
  <link rel="icon" type="image/png" href="/assets/Zarad_logo_for_white.png?v=zarad-logo-light-synced-20261119">
  <script>
    try {
      const savedTheme = localStorage.getItem("zarad-theme");
      document.documentElement.dataset.theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : "light";
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="stylesheet" href="/styles.css?v=zarad-logo-frame-preload-20261119">
  <script src="/theme.js?v=zarad-logo-frame-preload-20261119" defer></script>

  <style>
    .product-main {
      max-width: 1100px;
      width: calc(100% - 48px);
      margin: 0 auto;
      padding: 62px 0 110px;
    }

    .product-details {
      display: none;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 55px;
      align-items: center;
      animation: product-appear 0.35s ease;
    }

    .product-details.is-visible {
      display: grid;
    }

    @keyframes product-appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-image {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #e9decd;
      border-radius: 4px;
    }

    .product-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-information {
      min-width: 0;
      padding: 25px 0;
    }

    .product-kicker {
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      opacity: 0.65;
    }

    .product-information h1 {
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.15;
      margin: 18px 0;
    }

    .product-description {
      max-width: 580px;
      font-size: 1rem;
      line-height: 1.9;
    }

    .product-price {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(90, 65, 40, 0.2);
    }

    .product-price-label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: 9px;
    }

    .product-price-value {
      font-size: 1.6rem;
      font-weight: 600;
    }

    .product-price-value {
      display: inline-block;
      font-size: clamp(1.55rem, 3vw, 1.9rem);
      font-weight: 700;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .product-weight-selector {
      margin-top: 22px;
    }

    .product-weight-selector-label {
      display: block;
      margin-bottom: 11px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.72;
    }

    .product-weight-options {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .product-weight-option {
      min-width: 78px;
      min-height: 43px;
      padding: 10px 13px;
      border: 1px solid rgba(167, 123, 62, 0.58);
      border-radius: 3px;
      background: var(--paper-light);
      color: var(--wine);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .product-weight-option:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .product-weight-option.is-selected {
      border-color: var(--wine-dark);
      background: var(--wine-dark);
      color: #fff8ed;
    }

    .product-weight-option:focus-visible {
      outline: 2px solid var(--wine);
      outline-offset: 3px;
    }

    .product-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 13px 22px;
      border: 1px solid var(--gold);
      background: var(--paper-light);
      color: var(--wine);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .product-back:hover {
      transform: translateY(-2px);
      background: #efe2cb;
    }

    .product-back:focus-visible {
      outline: 2px solid var(--wine);
      outline-offset: 4px;
    }

    html[data-theme="dark"] .product-back {
      background: #302727;
      color: #e6c7a8;
      border-color: #a77b3e;
    }

    .product-loading,
    .product-status {
      max-width: 600px;
      margin: 50px auto;
      padding: 35px 25px;
      text-align: center;
      line-height: 1.8;
      border: 1px solid rgba(90, 65, 40, 0.15);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
    }

    .product-status h2 {
      margin: 0 0 12px;
    }

    .product-status p {
      margin: 0;
    }

    @media (max-width: 800px) {
      .product-main {
        padding-top: 60px;
      }

      .product-details {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .product-image {
        aspect-ratio: 4 / 3;
      }

      .product-information {
        padding-top: 10px;
      }
    }

    @media (max-width: 480px) {
      .product-main {
        width: calc(100% - 30px);
      }

      .product-information h1 {
        font-size: 2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .product-details {
        animation: none;
      }
    }
  </style>
</head>

<body class="catalog-page">

  <header class="site-header zarad-header">
    <div class="header-inner">
      <a class="brand zarad-logo" href="/" aria-label="Zarad — One Spice Away">
        <img
          id="zarad_logo"
          src="/assets/Zarad_logo_for_white.png?v=zarad-logo-light-synced-20261119"
          alt="Zarad — One Spice Away"
        >
      </a>

      <nav class="main-nav zarad-nav" aria-label="Navigare principală">
        <a class="nav-link" href="/" data-ro="Acasă" data-en="Home">Acasă</a>
        <a class="nav-link" href="/about" data-ro="Despre noi" data-en="About us">Despre noi</a>
        <a class="nav-link active" href="/catalog" aria-current="page" data-ro="Catalog" data-en="Catalogue">Catalog</a>
        <a class="nav-link" href="/events" data-ro="Evenimente" data-en="Events">Evenimente</a>
        <a class="nav-link" href="/contact" data-ro="Contact" data-en="Contact">Contact</a>
      </nav>

      <div class="zarad-right">
        <button
          class="language-toggle zarad-lang-pill is-ro"
          id="zarad_language"
          type="button"
          aria-label="Switch to English"
          title="English"
        >
          <span class="zarad-lang-slider" aria-hidden="true"></span>
          <span class="zarad-lang-label label-ro" aria-hidden="true">RO</span>
          <span class="zarad-lang-divider" aria-hidden="true"></span>
          <span class="zarad-lang-label label-en" aria-hidden="true">EN</span>
        </button>
      </div>
    </div>
  </header>

  <main class="product-main">


    <p
      class="product-loading"
      id="product_loading"
      role="status"
      data-ro="Se încarcă produsul..."
      data-en="Loading product..."
    >
      Se încarcă produsul...
    </p>

    <section
      class="product-details"
      id="product_details"
      aria-live="polite"
      aria-atomic="true"
      aria-labelledby="product_name"
    >
      <div class="product-image">
        <img id="product_photo" src="" alt="">
      </div>

      <div class="product-information">
        <span
          class="product-kicker"
          data-ro="COLECȚIA ZARAD"
          data-en="THE ZARAD COLLECTION"
        >
          COLECȚIA ZARAD
        </span>

        <h1 id="product_name"></h1>

        <p class="product-description" id="product_description"></p>

        <div class="product-price">
          <span
            class="product-price-label"
            data-ro="Preț"
            data-en="Price"
          >
            Preț
          </span>

          <span class="product-price-value" id="product_price" aria-live="polite"></span>

          <div class="product-weight-selector" id="product_weight_selector" hidden>
            <span
              class="product-weight-selector-label"
              data-ro="Alege gramajul"
              data-en="Choose a weight"
            >
              Alege gramajul
            </span>
            <div
              class="product-weight-options"
              id="product_weight_options"
              role="group"
              aria-label="Alege gramajul"
            ></div>
          </div>
        </div>

        <a href="/catalog" class="product-back">
        <span aria-hidden="true">←</span>
        <span data-ro="Înapoi la catalog" data-en="Back to catalogue">Înapoi la catalog</span>
        </a>
      </div>
    </section>

    <section
      class="product-status"
      id="product_status"
      role="alert"
      hidden
    >
      <h2 id="product_status_title"></h2>
      <p id="product_status_message"></p>

      <a href="/catalog" class="product-back">
      <span aria-hidden="true">←</span>
      <span data-ro="Înapoi la catalog" data-en="Back to catalogue">Înapoi la catalog</span>
      </a>
    </section>

  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="/" aria-label="Zarad — One Spice Away">
      <img src="/assets/Zarad_logo_for_white.png?v=zarad-logo-light-synced-20261119" alt="Zarad">
    </a>

    <p>One Spice Away</p>

    <div class="footer-contact-details" aria-label="Informații de contact">
      <a href="tel:+40757109006"><strong>Telefon:</strong> 0757.109.006</a>
      <a href="mailto:zarad.spiceshop@gmail.com"><strong>E-mail:</strong> zarad.spiceshop@gmail.com</a>
      <span><strong>Sediu:</strong> București, România</span>
      <a href="https://www.instagram.com/fe.zarad.srl26/" target="_blank" rel="noopener noreferrer"><strong>Instagram:</strong> @fe.zarad.srl26</a>
    </div>

    <span class="footer-copy">
      © <span id="current-year"></span> Zarad
    </span>
  </footer>

  <script>
    const languageButton = document.getElementById("zarad_language");
    const productDetails = document.getElementById("product_details");
    const productLoading = document.getElementById("product_loading");
    const productStatus = document.getElementById("product_status");

    const productName = document.getElementById("product_name");
    const productDescription = document.getElementById("product_description");
    const productPrice = document.getElementById("product_price");
    const productPriceSection = document.querySelector(".product-price");
    const productWeightSelector = document.getElementById("product_weight_selector");
    const productWeightOptions = document.getElementById("product_weight_options");
    const productPhoto = document.getElementById("product_photo");

    const statusTitle = document.getElementById("product_status_title");
    const statusMessage = document.getElementById("product_status_message");

    let currentLanguage = "ro";
    let currentProduct = null;
    let currentStatus = null;
    let selectedWeightGrams = null;

    document.getElementById("current-year").textContent =
      new Date().getFullYear();

    function getProductDescriptor(name) {
      return name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function getProductName(product) {
      return currentLanguage === "en"
        ? product.name_en || product.name
        : product.name;
    }

    function getProductDescription(product) {
      return currentLanguage === "en"
        ? product.description_en || product.description
        : product.description;
    }

    function formatPriceNumber(value) {
      return new Intl.NumberFormat(
        currentLanguage === "ro" ? "ro-RO" : "en-GB",
        { minimumFractionDigits: 0, maximumFractionDigits: 2 }
      ).format(value);
    }

    function formatMoney(value) {
      const amount = formatPriceNumber(value);
      return currentLanguage === "ro" ? amount + " lei" : "RON " + amount;
    }

    function formatMoneyRange(range) {
      const minimum = formatPriceNumber(range.min);
      const maximum = formatPriceNumber(range.max);
      return currentLanguage === "ro"
        ? minimum + "–" + maximum + " lei"
        : "RON " + minimum + "–" + maximum;
    }

    function renderProductPricing(product) {
      const options = Array.isArray(product.weight_options)
        ? product.weight_options.filter(option =>
            option &&
            Number.isFinite(Number(option.grams)) &&
            Number.isFinite(Number(option.price))
          )
        : [];

      productWeightOptions.replaceChildren();

      if (options.length > 0) {
        const selected = options.find(option =>
          Number(option.grams) === Number(selectedWeightGrams)
        ) || options[0];

        selectedWeightGrams = Number(selected.grams);
        productPrice.textContent = "";
        productWeightSelector.hidden = false;
        productWeightOptions.setAttribute(
          "aria-label",
          currentLanguage === "ro" ? "Alege gramajul" : "Choose a weight"
        );

        options.forEach(option => {
          const grams = Number(option.grams);
          const price = Number(option.price);
          const isSelected = grams === selectedWeightGrams;
          const button = document.createElement("button");

          button.type = "button";
          button.className = "product-weight-option" + (isSelected ? " is-selected" : "");
          button.textContent = formatPriceNumber(grams) + " g · " + formatMoney(price);
          button.setAttribute("aria-pressed", String(isSelected));
          button.setAttribute("aria-label", formatPriceNumber(grams) + " g — " + formatMoney(price));
          button.addEventListener("click", () => {
            selectedWeightGrams = grams;
            renderProductPricing(product);
          });

          productWeightOptions.appendChild(button);
        });

        productPriceSection.hidden = false;
        return;
      }

      selectedWeightGrams = null;
      productWeightSelector.hidden = true;

      let priceText = "";
      let weightText = "";

      if (typeof product.price_amount === "number" && Number.isFinite(product.price_amount)) {
        priceText = formatMoney(product.price_amount);
        weightText = Number.isFinite(Number(product.weight_g))
          ? formatPriceNumber(Number(product.weight_g)) + " g"
          : "";
      } else if (
        product.price_range &&
        Number.isFinite(Number(product.price_range.min)) &&
        Number.isFinite(Number(product.price_range.max))
      ) {
        priceText = formatMoneyRange(product.price_range);
        weightText = Number.isFinite(Number(product.weight_g))
          ? formatPriceNumber(Number(product.weight_g)) + " g"
          : "";
      } else if (
        product.price_per_gram_range &&
        Number.isFinite(Number(product.price_per_gram_range.min)) &&
        Number.isFinite(Number(product.price_per_gram_range.max))
      ) {
        const minimum = formatPriceNumber(product.price_per_gram_range.min);
        const maximum = formatPriceNumber(product.price_per_gram_range.max);
        priceText = currentLanguage === "ro"
          ? minimum + "–" + maximum + " lei / gram"
          : "RON " + minimum + "–" + maximum + " / gram";
      } else {
        const legacyPrice = currentLanguage === "en"
          ? product.price_en || product.price
          : product.price;
        priceText = legacyPrice === undefined || legacyPrice === null
          ? ""
          : String(legacyPrice);
      }

      productPrice.textContent = priceText;
      productPriceSection.hidden = !priceText;
    }

    function showStatus(type) {
      const messages = {
        missing: {
          ro: {
            title: "Produsul nu a fost specificat",
            message: "Accesează catalogul și selectează produsul pe care dorești să îl descoperi."
          },
          en: {
            title: "No product specified",
            message: "Visit the catalogue and select the product you would like to explore."
          }
        },
        notFound: {
          ro: {
            title: "Produsul nu a fost găsit",
            message: "Produsul solicitat nu există în catalogul Zarad."
          },
          en: {
            title: "Product not found",
            message: "The requested product does not exist in the Zarad catalogue."
          }
        },
        failed: {
          ro: {
            title: "Catalogul nu a putut fi încărcat",
            message: "Te rugăm să reîncarci pagina sau să revii la catalog."
          },
          en: {
            title: "The catalogue could not be loaded",
            message: "Please refresh the page or return to the catalogue."
          }
        }
      };

      currentStatus = type;

      const message = messages[type][currentLanguage];

      statusTitle.textContent = message.title;
      statusMessage.textContent = message.message;

      productLoading.hidden = true;
      productDetails.classList.remove("is-visible");
      productStatus.hidden = false;
    }

    function renderProduct(product) {
      if (!product) {
        return;
      }

      productName.textContent = getProductName(product);
      productDescription.textContent = getProductDescription(product);
      renderProductPricing(product);

      const folder = product.folder
        .split("/")
        .map(encodeURIComponent)
        .join("/");

      const image = product.image
        .split("/")
        .map(encodeURIComponent)
        .join("/");

      productPhoto.src = `/assets/${folder}/${image}`;
      productPhoto.alt = getProductName(product);

      productLoading.hidden = true;
      productStatus.hidden = true;
      productDetails.classList.add("is-visible");

      document.title = `${getProductName(product)} — Zarad`;
    }

    function setLanguage(language) {
      currentLanguage = language;
      document.documentElement.lang = language;

      document.querySelectorAll("[data-ro][data-en]").forEach(element => {
        element.textContent = element.dataset[language];
      });

      const isEnglish = language === "en";

      languageButton.classList.toggle("is-en", isEnglish);
      languageButton.classList.toggle("is-ro", !isEnglish);

      languageButton.setAttribute(
        "aria-label",
        isEnglish ? "Schimbă limba în română" : "Switch to English"
      );

      languageButton.title = isEnglish ? "Română" : "English";

      try {
        localStorage.setItem("zarad-language", language);
      } catch {
      }

      if (currentProduct) {
        renderProduct(currentProduct);
      }

      if (currentStatus) {
        showStatus(currentStatus);
      }
    }

    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const descriptor = params.get("descriptor");

      if (!descriptor) {
        showStatus("missing");
        return;
      }

      try {
        const response = await fetch("/catalog.json", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error("Unable to load catalog");
        }

        const products = await response.json();

        if (!Array.isArray(products)) {
          throw new Error("Invalid catalog format");
        }

        const product = products.find(item =>
          item &&
          typeof item.name === "string" &&
          getProductDescriptor(item.name) === descriptor
        );

        if (!product) {
          showStatus("notFound");
          return;
        }

        currentProduct = product;
        renderProduct(product);

      } catch (error) {
        console.error(error);
        showStatus("failed");
      }
    }

    let savedLanguage = "ro";

    try {
      savedLanguage =
        localStorage.getItem("zarad-language") === "en" ? "en" : "ro";
    } catch {
      savedLanguage = "ro";
    }

    setLanguage(savedLanguage);
    loadProduct();

    languageButton.addEventListener("click", () => {
      setLanguage(currentLanguage === "ro" ? "en" : "ro");
    });
  </script>

</body>
</html>
