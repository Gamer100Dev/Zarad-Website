<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ead9">
  <meta name="description" content="Descoperă detaliile evenimentelor Zarad.">
  <title>Eveniment — Zarad</title>
  <link rel="icon" type="image/png" href="/assets/Zarad_logo_for_white.png?v=zarad-light-favicon-20261118">
  <script>
    try {
      const savedTheme = localStorage.getItem("zarad-theme");
      document.documentElement.dataset.theme =
        savedTheme === "light" || savedTheme === "dark" ? savedTheme : "light";
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="stylesheet" href="/styles.css?v=zarad-full-logo-fit-20261118">
  <script src="/theme.js?v=zarad-logo-mode-switch-20261118" defer></script>
  <style>
    .event-detail-main {
      width: min(1100px, calc(100% - 48px));
      margin: 0 auto;
      padding: 62px 0 105px;
    }
    .event-detail {
      display: none;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      align-items: center;
      gap: 56px;
      animation: event-detail-appear .35s ease;
    }
    .event-detail.is-visible { display: grid; }
    @keyframes event-detail-appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .event-detail-image {
      padding: 8px;
      border: 1px solid rgba(201,150,59,.72);
      background: #eee1ce;
      box-shadow: 0 12px 32px rgba(53,27,25,.10);
    }
    .event-detail-image img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 760px;
      object-fit: contain;
    }
    .event-detail-information { min-width: 0; padding: 22px 0; }
    .event-detail-kicker {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
    }
    .event-detail-information h1 {
      margin: 16px 0 22px;
      color: var(--wine);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      font-weight: 500;
      line-height: 1.12;
    }
    .event-detail-description {
      max-width: 560px;
      font-size: 1rem;
      line-height: 1.9;
      color: var(--ink);
    }
    .event-detail-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 13px 22px;
      border: 1px solid var(--gold);
      background: var(--paper-light);
      color: var(--wine);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .06em;
      transition: transform .2s ease, background .2s ease;
    }
    .event-detail-back:hover { transform: translateY(-2px); background: #efe2cb; }
    .event-detail-back:focus-visible { outline: 2px solid var(--wine); outline-offset: 4px; }
    .event-detail-loading, .event-detail-status {
      max-width: 620px;
      margin: 45px auto;
      padding: 35px 25px;
      border: 1px solid rgba(90,65,40,.18);
      background: rgba(255,255,255,.2);
      text-align: center;
      line-height: 1.8;
    }
    .event-detail-status h2 { margin: 0 0 12px; color: var(--wine); }
    .event-detail-status p { margin: 0; }
    html[data-theme="dark"] .event-detail-image {
      border-color: rgba(214,166,83,.58);
      background: #3b302c;
      box-shadow: 0 12px 32px rgba(0,0,0,.25);
    }
    html[data-theme="dark"] .event-detail-information h1,
    html[data-theme="dark"] .event-detail-status h2 { color: #e6bda9; }
    html[data-theme="dark"] .event-detail-back {
      background: #302727;
      color: #e6c7a8;
      border-color: #a77b3e;
    }
    html[data-theme="dark"] .event-detail-loading,
    html[data-theme="dark"] .event-detail-status {
      background: #302727;
      border-color: rgba(230,189,169,.2);
    }
    @media (max-width: 800px) {
      .event-detail-main { padding-top: 42px; }
      .event-detail { grid-template-columns: 1fr; gap: 24px; }
      .event-detail-image { max-width: 620px; margin: 0 auto; }
      .event-detail-image img { max-height: 680px; }
      .event-detail-information { padding-top: 4px; }
    }
    @media (max-width: 480px) {
      .event-detail-main { width: calc(100% - 30px); }
      .event-detail-information h1 { font-size: 2.2rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .event-detail { animation: none; }
      .event-detail-back { transition: none; }
    }
  </style>
</head>
<body class="catalog-page">
  <header class="site-header zarad-header">
    <div class="header-inner">
      <a class="brand zarad-logo" href="/" aria-label="Zarad — One Spice Away">
        <img id="zarad_logo" src="/assets/Zarad_logo_for_white.png?v=zarad-logo-light-20261118" alt="Zarad — One Spice Away">
      </a>
      <nav class="main-nav zarad-nav" aria-label="Navigare principală / Main navigation">
        <a class="nav-link" href="/" data-ro="Acasă" data-en="Home">Acasă</a>
        <a class="nav-link" href="/catalog" data-ro="Catalog" data-en="Catalogue">Catalog</a>
        <a class="nav-link active" href="/events" aria-current="page" data-ro="Evenimente" data-en="Events">Evenimente</a>
        <a class="nav-link" href="/contact" data-ro="Contact" data-en="Contact">Contact</a>
      </nav>
      <div class="zarad-right">
        <button class="language-toggle zarad-lang-pill is-ro" id="zarad_language" type="button" aria-label="Switch to English" title="English">
          <span class="zarad-lang-slider" aria-hidden="true"></span>
          <span class="zarad-lang-label label-ro" aria-hidden="true">RO</span>
          <span class="zarad-lang-divider" aria-hidden="true"></span>
          <span class="zarad-lang-label label-en" aria-hidden="true">EN</span>
        </button>
      </div>
    </div>
  </header>

  <main class="event-detail-main">
    <p class="event-detail-loading" id="event_loading" role="status" data-ro="Se încarcă evenimentul..." data-en="Loading event...">Se încarcă evenimentul...</p>
    <section class="event-detail" id="event_details" aria-live="polite" aria-labelledby="event_name">
      <div class="event-detail-image">
        <img id="event_photo" src="" alt="">
      </div>
      <div class="event-detail-information">
        <span class="event-detail-kicker" id="event_number"></span>
        <h1 id="event_name"></h1>
        <p class="event-detail-description" id="event_description"></p>
        <a class="event-detail-back" href="/events">
          <span aria-hidden="true">←</span>
          <span data-ro="Înapoi la evenimente" data-en="Back to events">Înapoi la evenimente</span>
        </a>
      </div>
    </section>
    <section class="event-detail-status" id="event_status" role="alert" hidden>
      <h2 id="event_status_title"></h2>
      <p id="event_status_message"></p>
      <a class="event-detail-back" href="/events">
        <span aria-hidden="true">←</span>
        <span data-ro="Înapoi la evenimente" data-en="Back to events">Înapoi la evenimente</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="/" aria-label="Zarad — One Spice Away">
      <img src="/assets/Zarad_logo_for_white.png?v=zarad-logo-light-20261118" alt="Zarad">
    </a>
    <p>One Spice Away</p>
    <div class="footer-contact-details" aria-label="Informații de contact / Contact information">
      <a href="tel:+40757109006"><strong data-ro="Telefon:" data-en="Phone:">Telefon:</strong> 0757.109.006</a>
      <a href="mailto:zarad.spiceshop@gmail.com"><strong data-ro="E-mail:" data-en="Email:">E-mail:</strong> zarad.spiceshop@gmail.com</a>
      <span data-ro="Sediu: București, România" data-en="Location: Bucharest, Romania"><strong>Sediu:</strong> București, România</span>
      <a href="https://www.instagram.com/fe.zarad.srl26/" target="_blank" rel="noopener noreferrer"><strong data-ro="Instagram:" data-en="Instagram:">Instagram:</strong> @fe.zarad.srl26</a>
    </div>
    <span class="footer-copy">© <span id="current-year"></span> Zarad</span>
  </footer>

  <script>
    const languageButton = document.getElementById("zarad_language");
    const loading = document.getElementById("event_loading");
    const details = document.getElementById("event_details");
    const status = document.getElementById("event_status");
    const eventNumber = document.getElementById("event_number");
    const eventName = document.getElementById("event_name");
    const eventDescription = document.getElementById("event_description");
    const eventPhoto = document.getElementById("event_photo");
    const statusTitle = document.getElementById("event_status_title");
    const statusMessage = document.getElementById("event_status_message");

    let currentLanguage = "ro";
    let currentEvent = null;
    let currentStatus = null;

    document.getElementById("current-year").textContent = new Date().getFullYear();

    function localized(event, field) {
      return currentLanguage === "en"
        ? event[field + "_en"] || event[field]
        : event[field];
    }

    function showStatus(type) {
      const messages = {
        missing: {
          ro: ["Evenimentul nu a fost specificat", "Accesează pagina de evenimente și selectează evenimentul pe care dorești să îl descoperi."],
          en: ["No event specified", "Visit the events page and select the event you would like to explore."]
        },
        notFound: {
          ro: ["Evenimentul nu a fost găsit", "Evenimentul solicitat nu există în lista Zarad."],
          en: ["Event not found", "The requested event does not exist in the Zarad events list."]
        },
        failed: {
          ro: ["Evenimentele nu au putut fi încărcate", "Te rugăm să reîncarci pagina sau să revii la evenimente."],
          en: ["Events could not be loaded", "Please refresh the page or return to the events page."]
        }
      };
      currentStatus = type;
      const message = messages[type][currentLanguage];
      statusTitle.textContent = message[0];
      statusMessage.textContent = message[1];
      loading.hidden = true;
      details.classList.remove("is-visible");
      status.hidden = false;
    }

    function renderEvent(event) {
      eventNumber.textContent = event.number || "ZARAD";
      eventName.textContent = localized(event, "name");
      eventDescription.textContent = localized(event, "description");
      eventPhoto.src = "/assets/events/" + event.image.split("/").map(encodeURIComponent).join("/");
      eventPhoto.alt = localized(event, "name");
      loading.hidden = true;
      status.hidden = true;
      details.classList.add("is-visible");
      document.title = localized(event, "name") + " — Zarad";
      document.querySelector('meta[name="description"]').content = localized(event, "description");
    }

    function setLanguage(language) {
      currentLanguage = language;
      document.documentElement.lang = language;
      document.querySelectorAll("[data-ro][data-en]").forEach(element => {
        element.textContent = element.dataset[language];
      });
      const isEnglish = language === "en";
      languageButton.classList.toggle("is-en", isEnglish);
      languageButton.classList.toggle("is-ro", !isEnglish);
      languageButton.setAttribute("aria-label", isEnglish ? "Schimbă limba în română" : "Switch to English");
      languageButton.title = isEnglish ? "Română" : "English";
      try { localStorage.setItem("zarad-language", language); } catch {}
      if (currentEvent) renderEvent(currentEvent);
      if (currentStatus) showStatus(currentStatus);
    }

    async function loadEvent() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) { showStatus("missing"); return; }
      try {
        const response = await fetch("/events.json", { cache: "no-cache" });
        if (!response.ok) throw new Error("Unable to load events");
        const events = await response.json();
        if (!Array.isArray(events)) throw new Error("Invalid events list");
        const event = events.find(item => item && item.id === id);
        if (!event) { showStatus("notFound"); return; }
        currentEvent = event;
        renderEvent(event);
      } catch (error) {
        console.error(error);
        showStatus("failed");
      }
    }

    let savedLanguage = "ro";
    try { savedLanguage = localStorage.getItem("zarad-language") === "en" ? "en" : "ro"; } catch {}
    setLanguage(savedLanguage);
    loadEvent();
    languageButton.addEventListener("click", () => setLanguage(currentLanguage === "ro" ? "en" : "ro"));
  </script>
</body>
</html>
