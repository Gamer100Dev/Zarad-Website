# Zarad Website - Nginx reverse proxy
#
# The Zarad Node.js server should be running on 127.0.0.1:3000.
# This configuration listens on 8080 so it also works in Termux
# without root privileges. Change to "listen 80;" on a root-managed
# Linux server if desired.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    access_log logs/zarad-access.log;
    error_log  logs/zarad-error.log warn;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # Stream large images directly instead of buffering them into proxy_temp.
    # This prevents permission errors when Nginx runs as a separate service user.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve the Events directory index on both clean URL forms.
    # This makes /events work even on hosts that do not apply application rewrites.
    location = /events {
        proxy_pass http://127.0.0.1:3000/events/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /events/ {
        proxy_pass http://127.0.0.1:3000/events/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
